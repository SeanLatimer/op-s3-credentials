name: recover packslip

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag missing its packslip manifest
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-refs/tags/${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5

      - name: Verify release identity and download existing artifacts
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" +refs/heads/main:refs/remotes/origin/main
          commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor "$commit" refs/remotes/origin/main
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,tagName,assets > "$RUNNER_TEMP/recovery-release.json"
          jq -e --arg tag "$RELEASE_TAG" '
            .tagName == $tag and .isDraft == false and .isPrerelease == false and
            ([.assets[] | select(.name == "packslip.sigstore.json")] | length == 0)
          ' "$RUNNER_TEMP/recovery-release.json"
          mkdir "$RUNNER_TEMP/packslip-recovery"
          cd "$RUNNER_TEMP/packslip-recovery"
          gh release download "$RELEASE_TAG" --pattern checksums.txt --pattern checksums.txt.sigstore.json
          for os in linux darwin windows; do
            extension=tar.gz
            if [[ "$os" == windows ]]; then extension=zip; fi
            for arch in amd64 arm64; do
              gh release download "$RELEASE_TAG" --pattern "op-s3-credentials_${os}_${arch}.${extension}"
            done
          done
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Verify checksum signature and all six archive digests
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mise x cosign@3.1.3 -- cosign verify-blob \
            --bundle "$RUNNER_TEMP/packslip-recovery/checksums.txt.sigstore.json" \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$RELEASE_TAG" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$RUNNER_TEMP/packslip-recovery/checksums.txt"
          cd "$RUNNER_TEMP/packslip-recovery"
          # Restrict the signed list to exactly the six known archive names.
          for os in linux darwin windows; do
            extension=tar.gz
            if [[ "$os" == windows ]]; then extension=zip; fi
            for arch in amd64 arm64; do
              name="op-s3-credentials_${os}_${arch}.${extension}"
              awk -v name="$name" '$2 == name && $1 ~ /^[0-9a-f]+$/ && length($1) == 64 { print; count++ } END { if (count != 1) exit 1 }' checksums.txt >> verified-checksums.txt
            done
          done
          sha256sum --check --strict verified-checksums.txt

      - name: Publish only the missing packslip manifest
        uses: jdx/packslip@v1
        with:
          artifacts: ${{ runner.temp }}/packslip-recovery/*.tar.gz ${{ runner.temp }}/packslip-recovery/*.zip
          tag: ${{ inputs.tag }}
          commit: ${{ steps.release.outputs.commit }}
          bin: op-s3-credentials
          # Downloading existing binaries is not their build provenance.
          attest: 'false'
