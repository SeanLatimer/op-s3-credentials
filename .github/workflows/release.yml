name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # keyless cosign signing + packslip sigstore bundle

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # macOS runner: darwin CGO needs Apple frameworks, so it must build
    # natively with clang; linux cross-compiles via zig, windows needs no CGO.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Refuse tags not on main
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main

      - uses: jdx/mise-action@v5

      - name: Generate factual release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mise x git-cliff@2.14.2 -- git-cliff --current --strip header --output "$RUNNER_TEMP/release-notes.md"
          cat >> "$RUNNER_TEMP/release-notes.md" <<'EOF'

          ## Installation and verification

          See [installation instructions](https://github.com/SeanLatimer/op-s3-credentials#installation)
          and [signature verification](https://github.com/SeanLatimer/op-s3-credentials#verifying-releases).
          EOF

      - name: Build and publish
        # clang builds darwin; zig cross-compiles linux; windows needs no CGO.
        # cosign signs checksums.txt keylessly via the job's OIDC identity.
        run: mise x goreleaser zig cosign -- goreleaser release --clean --release-notes "$RUNNER_TEMP/release-notes.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

      - name: Publish packslip manifest
        uses: jdx/packslip@v1
        with:
          artifacts: dist/*.tar.gz dist/*.zip
          bin: op-s3-credentials

  editorial-notes:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Optional only: artifacts and factual notes have already been published.
    continue-on-error: true
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - name: Attempt free editorial notes
        continue-on-error: true
        run: go run ./tools/editorial
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
