[tools]
go = "1.27"
golangci-lint = "latest"

[tasks.build]
description = "Build a debug binary into bin/"
run = "go build -o bin/op-s3-credentials.exe ./cmd/op-s3-credentials"

# Release builds are goreleaser's job (CI); this task builds every target
# locally. mise fetches goreleaser and zig on demand.
[tasks.snapshot]
description = "Build release targets via goreleaser (full matrix needs macOS for darwin)"
run = "mise x goreleaser zig -- goreleaser release --snapshot --clean"

[tasks.test]
description = "Run unit tests"
run = "go test ./..."

[tasks.lint]
description = "Run golangci-lint (includes gofmt check)"
run = "golangci-lint run"

[tasks.fmt]
description = "Format source files"
run = "gofmt -w ."

[tasks.install]
description = "Install the binary to GOBIN"
run = "go install ./cmd/op-s3-credentials"

[tasks."release:preview"]
description = "Preview the next version and changelog (no files, tags, or releases written)"
tools = { git-cliff = "2.14.2" }
run = "go run ./tools/release -preview"

[tasks."release:prepare"]
description = "Prepare CHANGELOG.md on develop; never commits, tags, or publishes"
tools = { git-cliff = "2.14.2" }
run = "go run ./tools/release"
